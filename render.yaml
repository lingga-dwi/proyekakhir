services:
  - type: web
    name: daiku-interior
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: PAYMENT_EVIDENCE_DRIVER
        value: s3
      - key: PAYMENT_EVIDENCE_KEY
        sync: false
      - key: PAYMENT_EVIDENCE_SECRET
        sync: false
      - key: PAYMENT_EVIDENCE_REGION
        sync: false
      - key: PAYMENT_EVIDENCE_BUCKET
        value: payment-proofs
      - key: PAYMENT_EVIDENCE_ENDPOINT
        sync: false
      - key: PAYMENT_EVIDENCE_USE_PATH_STYLE
        value: "true"
      - key: CATALOG_IMAGES_DRIVER
        value: s3
      - key: CATALOG_IMAGES_BUCKET
        value: catalog-images
      - key: CATALOG_IMAGES_PUBLIC_URL
        sync: false
      - key: DAIKU_WHATSAPP_NUMBER
        sync: false
